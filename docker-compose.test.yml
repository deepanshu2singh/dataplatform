name: databricks-clone-v1-tests

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: databricks_clone_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d databricks_clone_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-upload-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - test_uploads:/tmp/dataplatform-test-uploads
    command:
      [
        "sh",
        "-c",
        "mkdir -p /tmp/dataplatform-test-uploads && chown -R 10001:10001 /tmp/dataplatform-test-uploads && chmod 770 /tmp/dataplatform-test-uploads",
      ]

  backend-test-api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/databricks_clone_test
      SECRET_KEY: phase8a2-test-secret-not-for-production
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /tmp/dataplatform-test-uploads
      LOG_LEVEL: INFO
    volumes:
      - test_uploads:/tmp/dataplatform-test-uploads
    depends_on:
      postgres-test:
        condition: service_healthy
      test-upload-init:
        condition: service_completed_successfully
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/databricks_clone_test
      SECRET_KEY: phase8a2-test-secret-not-for-production
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /tmp/dataplatform-test-uploads
      LOG_LEVEL: INFO
      TEST_API_URL: http://backend-test-api:8000/api/v1/
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/databricks_clone_test
      TEST_UPLOAD_DIR: /tmp/dataplatform-test-uploads
    volumes:
      - test_uploads:/tmp/dataplatform-test-uploads
    depends_on:
      backend-test-api:
        condition: service_healthy
    command: python -m pytest -q

volumes:
  test_uploads:
